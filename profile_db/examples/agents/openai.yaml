interface:
  display_name: "Profile Feedback Database (pfdb)"
  short_description: "Query the pfdb profile-feedback database via the CLI"
  default_prompt: "Use $pfdb-query to answer profiling questions from the local .pfdb working set. Ingest the capture first (pfdb ingest), then navigate the zoom levels: overview -> density -> critical_path -> why_sparse -> task -> deps -> why_late, and consult memory / perf_hints / pmu before touching an operator. Quote only returned facts; never fabricate numbers or emit a tuning verdict."
