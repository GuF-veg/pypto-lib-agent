INHERIT: .site-theme/docs-theme/base.yml

site_name: PyPTO Lib
site_description: PyPTO kernels and end-to-end LLM models for Ascend NPUs
site_url: https://www.pypto.ai/pypto-lib/
repo_url: https://github.com/hw-native-sys/pypto-lib
repo_name: hw-native-sys/pypto-lib
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  _hooks/
  requirements.txt
  theme-revision.txt

theme:
  custom_dir: .site-theme/docs-theme/overrides
  language: en
  # Keep instant navigation alongside the shared layout features.
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  pypto_project: pypto-lib

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

hooks:
  - docs/_hooks/repo_links.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get Started:
      - Overview: get-started/index.md
      - Installation and environment: get-started/installation.md
      - Run your first kernel: get-started/first-kernel.md
  - PyPTO Language:
      - Overview: pypto-language/index.md
      - 01-programming-model: pypto-language/01-programming-model.md
      - 02-syntax: pypto-language/02-syntax.md
      - 03-types: pypto-language/03-types.md
      - 04-control-flow: pypto-language/04-control-flow.md
      - 05-scopes-and-dependencies: pypto-language/05-scopes-and-dependencies.md
      - 06-tile-operations: pypto-language/06-tile-operations.md
      - 07-tensor-and-system-operations: pypto-language/07-tensor-and-system-operations.md
      - 08-dynamic-shapes: pypto-language/08-dynamic-shapes.md
      - 09-compiling-and-running: pypto-language/09-compiling-and-running.md
      - 10-distributed: pypto-language/10-distributed.md
      - 11-patterns-and-pitfalls: pypto-language/11-patterns-and-pitfalls.md
      - 12-api-index: pypto-language/12-api-index.md
      - Elementwise operations: pypto-language/14-elementwise.md
      - Reductions: pypto-language/15-reductions.md
      - Broadcast and expand operations: pypto-language/16-broadcast-expand.md
      - Matrix multiply: pypto-language/17-matmul.md
      - Shape, cast and layout: pypto-language/18-shape-layout.md
      - Data movement: pypto-language/19-data-movement.md
      - Tensor and system operators: pypto-language/20-tensor-system-ops.md
      - Gather, scatter and sort: pypto-language/21-gather-sort.md
  - PyPTO Coding:
      - Overview: pypto-coding/index.md
      - L2 programming: pypto-coding/l2-programming.md
      - Operations: pypto-coding/operations.md
      - Loops: pypto-coding/loops.md
      - L3 programming: pypto-coding/l3-programming.md
      - Golden and run: pypto-coding/golden-and-run.md
      - Naming and comments: pypto-coding/naming-and-comments.md
      - CCE extern kernel: pypto-coding/cce-extern-kernel.md
  - Run and Validate:
